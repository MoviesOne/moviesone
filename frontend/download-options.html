<!-- =========================================================
     MOVIEBOX DOWNLOAD OPTIONS COMPONENT
     File: components/download-options.html
========================================================= -->

<div id="downloadSheet" class="download-sheet" aria-hidden="true">

    <!-- BACKDROP -->
    <div
        class="download-sheet-backdrop"
        data-download-close
    ></div>


    <!-- SHEET PANEL -->
    <div class="download-sheet-panel">

        <!-- HANDLE -->
        <div class="download-sheet-handle"></div>


        <!-- HEADER -->
        <div class="download-sheet-header">

            <div>
                <span class="download-sheet-kicker">
                    DOWNLOAD
                </span>

                <h2 id="downloadSheetTitle">
                    Download Options
                </h2>

                <p id="downloadSheetSubtitle">
                    Choose your preferred download option
                </p>
            </div>


            <button
                type="button"
                class="download-sheet-close"
                data-download-close
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- DIVIDER -->
        <div class="download-sheet-divider"></div>


        <!-- =====================================================
             DOWNLOAD CARDS
        ====================================================== -->

        <div class="download-sheet-content">


            <!-- =================================================
                 OPTION 1 — SCREENSCOPE
            ================================================== -->

            <div class="card-wrapper card-item-1">

                <div class="option-label label-itachi">
                    OPTION 1
                </div>


                <button
                    type="button"
                    class="anime-card anime-sharingan-card"
                    data-download-option="1"
                    data-shatter-colors="#ff1e2e,#ff4d4d,#ffffff,#000000"
                >

                    <!-- MOVING BACKGROUND -->
                    <div class="roaming-bg-layer">

                        <div class="wandering-itachi-eye">

                            <svg
                                viewBox="0 0 100 100"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <defs>
                                    <radialGradient
                                        id="itachiEyeGradient"
                                    >
                                        <stop
                                            offset="0%"
                                            stop-color="#ff7777"
                                        />
                                        <stop
                                            offset="45%"
                                            stop-color="#e00020"
                                        />
                                        <stop
                                            offset="100%"
                                            stop-color="#300006"
                                        />
                                    </radialGradient>
                                </defs>

                                <circle
                                    cx="50"
                                    cy="50"
                                    r="46"
                                    fill="url(#itachiEyeGradient)"
                                    stroke="#ff263d"
                                    stroke-width="3"
                                />

                                <circle
                                    cx="50"
                                    cy="50"
                                    r="22"
                                    fill="#080000"
                                    stroke="#ff7777"
                                    stroke-width="2"
                                />

                                <circle
                                    cx="50"
                                    cy="50"
                                    r="8"
                                    fill="#000"
                                />

                                <path
                                    d="M50 12 L55 39 L50 45 L45 39 Z"
                                    fill="#080000"
                                />

                                <path
                                    d="M88 50 L61 55 L55 50 L61 45 Z"
                                    fill="#080000"
                                />

                                <path
                                    d="M50 88 L45 61 L50 55 L55 61 Z"
                                    fill="#080000"
                                />

                                <path
                                    d="M12 50 L39 45 L45 50 L39 55 Z"
                                    fill="#080000"
                                />

                            </svg>

                            <span class="cornea-shine"></span>

                        </div>

                    </div>


                    <!-- CONTENT -->
                    <div class="card-left">

                        <div class="icon-box-itachi explode-target">
                            <span class="download-icon">
                                ↓
                            </span>
                        </div>


                        <div class="text-content">

                            <strong class="title title-red">
                                SCREENSCOPE
                            </strong>

                            <span class="subtitle sub-red">
                                ScreenScope DL
                            </span>

                        </div>

                    </div>


                    <span class="external-icon ext-red">
                        ↗
                    </span>

                </button>

            </div>
