<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="./assets/site.webmanifest">
    <!-- MovieBox favicon / brand icon -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon-180x180.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>MovieBox Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, #1a1a22 0%, #09090b 45%, #050506 100%);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .admin-login {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .login-card {
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            background: rgba(18, 18, 22, 0.92);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand h1 span {
            color: #e50914;
        }

        .brand p {
            margin-top: 8px;
            color: #8f8f98;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cfcfd5;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            background: #0d0d10;
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #e50914;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #e50914;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }

        .login-message.error {
            display: block;
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.25);
            color: #ff6b72;
        }

        .login-message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #6ee7a0;
        }
    </style>
</head>

<body>

    <main class="admin-login">
        <div class="login-card">

            <div class="brand">
                <h1>Movie<span>Box</span></h1>
                <p>Admin Panel</p>
            </div>

            <form id="admin-login-form">

                <div class="form-group">
                    <label for="admin-username">Username</label>
                    <input
                        type="text"
                        id="admin-username"
                        autocomplete="username"
                        placeholder="Enter username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input
                        type="password"
                        id="admin-password"
                        autocomplete="current-password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="admin-login-btn"
                >
                    Login
                </button>

                <div id="login-message" class="login-message"></div>

            </form>

        </div>
    </main>

<script>
    const loginForm = document.getElementById("admin-login-form");
    const loginButton = document.getElementById("admin-login-btn");
    const loginMessage = document.getElementById("login-message");

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const username = document.getElementById("admin-username").value.trim();
        const password = document.getElementById("admin-password").value;

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        loginMessage.className = "login-message";
        loginMessage.textContent = "";

        try {
            const response = await fetch("http://localhost:4000/api/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Login failed");
            }

            loginMessage.className = "login-message success";
loginMessage.textContent = "Login successful!";

setTimeout(() => {
    window.location.href = "admin-dashboard.html";
}, 500);

        } catch (error) {
            console.error("Admin login error:", error);

            loginMessage.className = "login-message error";
            loginMessage.textContent = error.message || "Login failed";

        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    });
</script>

</body>
</html>
