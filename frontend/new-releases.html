<script>
function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");

    if (!sidebar) return;

    const isClosed = sidebar.classList.contains("-translate-x-full");

    if (isClosed) {
        sidebar.classList.remove("-translate-x-full");

        if (overlay) {
            overlay.classList.remove("hidden");
        }
    } else {
        sidebar.classList.add("-translate-x-full");

        if (overlay) {
            overlay.classList.add("hidden");
        }
    }
}

function closeSidebar() {
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");

    if (sidebar) {
        sidebar.classList.add("-translate-x-full");
    }

    if (overlay) {
        overlay.classList.add("hidden");
    }
}

function navigateTo(screen) {
    closeSidebar();

    switch (screen) {
        case "home":
            window.location.href = "index.html";
            break;

        case "search":
            window.location.href = "index.html?screen=search";
            break;

        case "movies":
            window.location.href = "index.html?screen=movies";
            break;

        case "tv":
            window.location.href = "index.html?screen=tv";
            break;

        case "watch-later":
            window.location.href = "index.html?screen=watch-later";
            break;

        case "history":
            window.location.href = "index.html?screen=history";
            break;

        case "ads":
            window.location.href = "index.html?screen=ads";
            break;

        case "new-releases":
            window.location.href = "new-releases.html";
            break;
    }
}
</script>
<script>
fetch("./sidebar.html")
    .then(response => {
        if (!response.ok) {
            throw new Error("Sidebar load nahi hua");
        }
        return response.text();
    })
    .then(html => {
        document.getElementById("sidebar-container").innerHTML = html;

        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }
    })
    .catch(error => console.error("Sidebar error:", error));
</script>
