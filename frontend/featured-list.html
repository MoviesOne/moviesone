<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="./assets/site.webmanifest">
    <!-- MovieBox favicon / brand icon -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon-180x180.png">


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Featured List - MovieBox</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="featured-list-page text-white">

    <!-- HEADER -->

    <header
        class="sticky top-0 z-50 border-b border-white/10 bg-black/90 backdrop-blur-xl"
    >

        <div
            class="mx-auto flex h-16 max-w-[1600px] items-center gap-4 px-5 md:px-10"
        >

            <button
                type="button"
                onclick="toggleSidebar()"
                class="rounded-xl p-2 text-white/80 transition hover:bg-white/10 hover:text-white"
            >
                ☰
            </button>


            <button
                type="button"
                onclick="location.href='index.html'"
                class="text-xl font-black tracking-tight"
            >
                MovieBox
            </button>


            <div class="ml-auto w-full max-w-md">

                <input
    id="featured-list-search"
    type="search"
    placeholder="Search..."
    onclick="openSearchScreen()"
    onfocus="openSearchScreen()"
    class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-white outline-none placeholder:text-white/40 focus:border-orange-500/50"
>

            </div>

        </div>

    </header>


   <!-- SHARED SIDEBAR -->
<div id="sidebar-container"></div>
    <!-- Sidebar Overlay -->
<div
    id="sidebar-overlay"
    onclick="toggleSidebar()"
    class="fixed inset-0 z-50 hidden bg-black/60"
></div>

    <!-- MAIN -->

  <main
    class="mx-auto max-w-[1600px] px-5 py-12 md:px-10 md:py-14 lg:px-14 lg:py-16"
>

        <div class="mb-8">

            <p
                class="mb-2 text-sm font-bold uppercase tracking-[0.2em] text-orange-400"
            >
                Featured
            </p>


            <h1
                id="featured-list-title"
                class="text-3xl font-black md:text-5xl"
            >
                Featured List
            </h1>


            <p
                id="featured-list-description"
                class="mt-3 max-w-3xl text-sm leading-6 text-white/50 md:text-base"
            >
                Explore featured movies and series.
            </p>

        </div>


        <!-- GRID -->

        <div
            id="featured-list-grid"
            class="grid grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"
        >
        </div>


        <!-- LOADING -->

        <div
            id="featured-list-loading"
            class="hidden items-center justify-center py-12"
        >

            <div
                class="h-8 w-8 animate-spin rounded-full border-2 border-white/20 border-t-orange-500"
            ></div>

        </div>


        <!-- END -->

        <div
            id="featured-list-end"
            class="hidden py-12 text-center text-sm font-semibold text-white/40"
        >
            You've reached the end.
        </div>


        <!-- SENTINEL -->

        <div
            id="featured-list-sentinel"
            class="h-10"
        ></div>

    </main>

    <!-- SEARCH OVERLAY -->

<section
    id="search-screen"
    class="search-overlay hidden"
>

    <div
        class="search-overlay-bg"
        onclick="closeSearchScreen()"
    ></div>


    <div class="search-modal">

        <div class="search-modal-header">

            <h2>
                Search
            </h2>

            <button
                type="button"
                class="search-close-btn"
                onclick="closeSearchScreen()"
            >
                <i data-lucide="x"></i>
            </button>

        </div>


        <div class="search-modal-input">

            <i
                data-lucide="search"
                class="search-modal-icon"
            ></i>

            <input
                id="search-page-input"
                type="text"
                autocomplete="off"
                placeholder="Search..."
            >

        </div>


        <div
            id="search-results"
            class="search-modal-results"
        >

            <div class="search-empty-state">

                <i data-lucide="search"></i>

                <span>
                    Search movies and series
                </span>

            </div>

        </div>

    </div>

</section>

    <script src="js/api.js"></script>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="./js/seo.js"></script>

<script src="js/app.js"></script>

<script src="js/featured-list.js"></script>

    <script>

        function toggleSidebar() {

            const sidebar =
                document.getElementById(
                    "sidebar"
                );

            const overlay =
                document.getElementById(
                    "sidebar-overlay"
                );

            sidebar.classList.toggle(
                "-translate-x-full"
            );

            overlay.classList.toggle(
                "hidden"
            );

        }


        function closeSidebar() {

            const sidebar =
                document.getElementById(
                    "sidebar"
                );

            const overlay =
                document.getElementById(
                    "sidebar-overlay"
                );

            sidebar.classList.add(
                "-translate-x-full"
            );

            overlay.classList.add(
                "hidden"
            );

        }

    </script>
    
<script>

    function navigateTo(screen) {
    closeSidebar();

    switch (screen) {
        case "ads":
            window.location.href = "index.html?screen=ads";
            break;

        case "home":
            window.location.href = "index.html";
            break;

        case "search":
            openSearchScreen();
            break;

        case "movies":
            window.location.href = "popular.html";
            break;

        case "tv":
            window.location.href = "trending-tv.html";
            break;
    }
}
fetch("./sidebar.html")
    .then(response => {
        if (!response.ok) {
            throw new Error("Sidebar load nahi hua");
        }
        return response.text();
    })
    .then(html => {
        document.getElementById("sidebar-container").innerHTML = html;

        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }
    })
    .catch(error => console.error("Sidebar error:", error));
</script>

</body>

</html>
