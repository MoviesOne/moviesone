<script>

document.addEventListener("DOMContentLoaded", () => {

    /* =========================
       LUCIDE ICONS
    ========================= */

    if (typeof lucide !== "undefined") {
        lucide.createIcons();
    }


    /* =========================
       SIDEBAR
    ========================= */

  window.openSidebar = function () {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("sidebar-overlay");

    if (sidebar) {
        sidebar.classList.remove("-translate-x-full");
        sidebar.classList.add("translate-x-0");
    }

    if (overlay) {
        overlay.classList.remove("hidden");
    }

    document.body.classList.add("sidebar-open");

};


window.closeSidebar = function () {

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("sidebar-overlay");

    if (sidebar) {
        sidebar.classList.remove("translate-x-0");
        sidebar.classList.add("-translate-x-full");
    }

    if (overlay) {
        overlay.classList.add("hidden");
    }

    document.body.classList.remove("sidebar-open");

};

    /* =========================
       NAVIGATION
    ========================= */

   window.seriesNavigateWatchLater = function () {

    window.location.href =
        "index.html#watch-later";

};


window.focusSeriesSearch = function () {

    closeSidebar();

    const input =
        document.getElementById("series-search-input");

    if (input) {
        setTimeout(() => {
            input.focus();
        }, 200);
    }

};


window.seriesNavigateHistory = function () {

    window.location.href =
        "index.html#history";

};


window.seriesNavigateAds = function () {

    window.location.href =
        "index.html#ads";

};


/* =========================
   SEARCH
========================= */
    const searchInput =
        document.getElementById(
            "series-search-input"
        );

    const searchResults =
        document.getElementById(
            "series-search-results"
        );

    let searchTimer = null;


    if (!searchInput) {
        return;
    }


    searchInput.addEventListener(
        "input",
        function () {

            const query =
                this.value.trim();

            clearTimeout(searchTimer);


            if (!query) {

                if (searchResults) {

                    searchResults.innerHTML = "";

                    searchResults.classList.remove(
                        "show"
                    );

                }

                return;

            }


            searchTimer = setTimeout(
                () => {

                    seriesSearch(query);

                },
                350
            );

        }
    );


    searchInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key !== "Enter") {
                return;
            }

            const query =
                this.value.trim();

            if (!query) {
                return;
            }


            window.location.href =
                "index.html?search=" +
                encodeURIComponent(query);

        }
    );


    /* =========================
       LIVE SEARCH
    ========================= */

    async function seriesSearch(query) {

        if (!searchResults) {
            return;
        }


        searchResults.classList.add("show");


        searchResults.innerHTML = `
            <div class="series-search-loading">
                Searching...
            </div>
        `;


        try {

            const response =
                await apiGet(
                    `/movies/search?query=${encodeURIComponent(query)}`
                );


            const items =
                response?.results ||
                response?.data ||
                [];


            if (
                !Array.isArray(items) ||
                items.length === 0
            ) {

                searchResults.innerHTML = `
                    <div class="series-search-empty">
                        No results found.
                    </div>
                `;

                return;

            }


            searchResults.innerHTML =
                items
                    .slice(0, 6)
                    .map(item => {

                        const id =
                            item.id ||
                            item.tmdbId;

                        const title =
                            item.title ||
                            item.name ||
                            "Untitled";

                        const image =
                            item.poster ||
                            item.poster_path ||
                            "";

                        const type =
                            item.media_type === "tv"
                                ? "TV Series"
                                : "Movie";


                        return `
                            <button
                                type="button"
                                class="series-search-item"
                                data-id="${escapeHtml(String(id))}"
                                data-type="${item.media_type === "tv" ? "tv" : "movie"}"
                            >

                                ${
                                    image
                                        ? `
                                            <img
                                                src="${escapeHtml(image)}"
                                                alt=""
                                            >
                                          `
                                        : ""
                                }

                                <span>

                                    <strong>
                                        ${escapeHtml(title)}
                                    </strong>

                                    <small>
                                        ${type}
                                    </small>

                                </span>

                            </button>
                        `;

                    })
                    .join("");


            /* Result click */

            searchResults
                .querySelectorAll(".series-search-item")
                .forEach(item => {

                    item.addEventListener(
                        "click",
                        () => {

                            const id =
                                item.dataset.id;

                            const type =
                                item.dataset.type;


                            if (type === "tv") {

                                window.location.href =
                                    `series.html?series=${encodeURIComponent(id)}&from=series`;

                            } else {

                                window.location.href =
                                    `index.html?movie=${encodeURIComponent(id)}&from=series`;

                            }

                        }
                    );

                });


        } catch (error) {

            console.error(
                "Series search error:",
                error
            );


            searchResults.innerHTML = `
                <div class="series-search-empty">
                    Search unavailable.
                </div>
            `;

        }

    }


    /* =========================
       CLOSE SEARCH
    ========================= */

    document.addEventListener(
        "click",
        function (event) {

            const searchBox =
                document.querySelector(
                    ".series-search"
                );


            if (
                searchResults &&
                searchBox &&
                !searchBox.contains(event.target) &&
                !searchResults.contains(event.target)
            ) {

                searchResults.classList.remove(
                    "show"
                );

            }

        }
    );

});

</script>
<section id="search-screen" class="search-overlay hidden">
    <div class="search-overlay-bg" onclick="closeSearchScreen()"></div>

    <div class="search-modal">
        <div class="search-modal-header">
            <h2>Search</h2>

            <button
                type="button"
                class="search-close-btn"
                onclick="closeSearchScreen()"
            >
                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="search-modal-input">
            <i data-lucide="search" class="search-modal-icon"></i>

            <input
                id="search-page-input"
                type="text"
                autocomplete="off"
                placeholder="Search..."
            >
        </div>

        <div id="search-results" class="search-modal-results">
            <div class="search-empty-state">
                <i data-lucide="search"></i>
                <span>Search movies and series</span>
            </div>
        </div>
    </div>
</section>
<script>
fetch("./sidebar.html")
    .then(response => {
        if (!response.ok) {
            throw new Error("Sidebar load nahi hua");
        }
        return response.text();
    })
    .then(html => {
        document.getElementById("sidebar-container").innerHTML = html;
    })
    .catch(error => console.error("Sidebar error:", error));
</script>
